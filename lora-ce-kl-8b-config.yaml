# Configuration for lora-ce-kl-8b.py
# This file mirrors the original LlamaFactory command used to fine-tune Qwen3-8B.
# All values can be overridden on the command line, e.g.:
#   python lora-ce-kl-8b.py --config_file lora-ce-kl-8b-config.yaml --learning_rate 1e-5

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model_name_or_path: /home/qiangyu/Models/Qwen/Qwen3-8B
trust_remote_code: true
torch_dtype: bfloat16

# ---------------------------------------------------------------------------
# Attention
# ---------------------------------------------------------------------------
# auto | fa2 | sdpa | eager
# NOTE: transformers 5.6.0 has a bug in its flash_attention_2 integration
# (s_aux.to() on None for models without attention sinks like Qwen3), so fa2/auto
# will crash. Use sdpa here; it is fast and memory-efficient on A800.
flash_attn: sdpa

# ---------------------------------------------------------------------------
# LoRA
# ---------------------------------------------------------------------------
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.00
lora_target: all
lora_bias: none
use_rslora: false

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
# Dataset directory is derived from the parent directory of dataset_info_path.
dataset_info_path: /home/qiangyu/Models/FineTune/Data/dataset_info.json
# Use "all" to load every dataset listed in dataset_info.json. To load only
# specific datasets, replace "all" with a list of dataset names, e.g.:
#   datasets:
#     - no_inject_data
#     - simple_inject_data
datasets:
  - all

role_tag: from
content_tag: value
user_tag: human
assistant_tag: gpt
system_tag: system
observation_tag: tool
tool_role_in_template: tool

# In assistant turns without <tool_call_security>, every assistant token (tagged or
# untagged) uses this single weight. In security turns, the per-tag weights below
# still apply and untagged content uses loss_calc_ce_default_with_security_weight.
loss_calc_ce_default_without_security_weight: 1.0

# Every assistant turn is trained. Untagged assistant content uses
# loss_calc_ce_default_with_security_weight. Content inside the three XML tags below uses
# the respective tag weights. A non-positive weight for <think> means those tokens
# are ignored (labels stay -100). Set a tag to null to disable that tag.
loss_calc_ce_default_with_security_weight: 1.0  # default CE weight for untagged assistant content in security turns
loss_calc_ce_tool_call_security_tag: tool_call_security
loss_calc_ce_tool_call_security_with_security_weight: 1.5
loss_calc_ce_think_tag: think
loss_calc_ce_think_weight: -100  # think CE weight in all assistant turns; <=0 ignores
loss_calc_ce_tool_call_with_security_tag: tool_call
loss_calc_ce_tool_call_with_security_weight: 1.0  # tool_call CE weight in all assistant turns; <=0 ignores

cutoff_len: 8192
max_samples: 100000
preprocessing_num_workers: 16
shuffle_seed: 42
eval_data_ratio: 0.05

# Ratio of non-security turns to security turns sampled per dataset.
# 0.0 means only security turns are used; >0 randomly samples that fraction
# of non-security turns relative to security turns (per dataset).
no_security_to_security_turn_ratio: 0.0

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
stage: sft
do_train: true
output_dir: /home/qiangyu/Models/FineTune/Qwen/cekl_train_20260805_ce1.5_0.0nosecurity_3epochs_8B
overwrite_output_dir: false
seed: 42
num_train_epochs: 3.0
gradient_checkpointing: true
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-05
lr_scheduler_type: cosine
warmup_steps: 0
max_grad_norm: 1.0
optim: adamw_torch
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-08
max_steps: -1

# ---------------------------------------------------------------------------
# Logging / checkpointing / evaluation
# ---------------------------------------------------------------------------
logging_steps: 10  # log training loss every N steps
save_steps: 100
eval_strategy: steps
eval_steps: 100
save_total_limit: null
logging_dir: null
report_to: none
plot_loss: true
plot_eval_loss: true
eval_after_save: true
final_eval: true
include_num_input_tokens_seen: true

# ---------------------------------------------------------------------------
# Distributed training
# ---------------------------------------------------------------------------
# GPU selection is controlled ENTIRELY by CUDA_VISIBLE_DEVICES in lora-ce-kl-8b-run.sh.
ddp_timeout: 180000000
deepspeed_config: ds_z2_config.json

# ---------------------------------------------------------------------------
# Resource limits
# ---------------------------------------------------------------------------
per_device_max_memory_gb: 78.0  # cap PyTorch allocation per GPU; set to null to disable

# ---------------------------------------------------------------------------
# Qwen3 thinking mode
# ---------------------------------------------------------------------------
enable_thinking: true

# ---------------------------------------------------------------------------
# KL anchoring against the frozen base weights (disable_adapter() is used)
# ---------------------------------------------------------------------------
loss_calc_kl_enabled: false  # default false: only CE loss, no KL reference-logit computation
loss_calc_kl_alpha: 0.02
loss_calc_kl_think_alpha: 0.04  # KL coefficient for <think> in all assistant turns when enabled
loss_calc_kl_enable_without_security: false  # enable KL for assistant turns without tool_call_security (think + background, excluding tool_call blocks)
loss_calc_kl_enable_with_security: false  # enable KL for assistant turns that contain tool_call_security: KL is applied to background (untagged assistant content) and <think> blocks; <tool_call> and <tool_call_security> blocks are excluded from KL
