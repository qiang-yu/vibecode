[xray]
@echo off
cd frpSchool-win
xray.exe -config  xray.json


[frpc]
@echo off
cd frpSchool-win
frpc.exe -c frpc.ini


[chrome]
set CurrentDir=%~dp0
set Cache=%CurrentDir%Cache
set Data=%CurrentDir%Data
setlocal enableextensions
if not exist %Cache% ( md %Cache% )
if not exist %Data% ( md %Data% )
endlocal
"App\Chrome.exe" --disable-features=RendererCodeIntegrity,FlashDeprecationWarning --disable-logging --start-maximized --disk-cache-dir=%Cache% --user-data-dir=%Data%   --proxy-server="127.0.0.1:11083"  


[main]
main=chrome
output_log=false
title="学校穿梭"
