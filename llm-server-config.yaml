model:
  base_model_path: /home/qiangyu/Models/Qwen/Qwen3-8B
  lora_adapter_path: /home/qiangyu/Models/FineTune/Qwen/cekl_train_20260805_ce1.5_0.0nosecurity_3epochs_8B
  # Supported: Qwen3, Llama3, Mistral3
  model_type: Qwen3
  max_tokens: 32768
  device: cuda
  # bfloat16 or float16
  dtype: bfloat16

server:
  host: localhost
  port: 19001

templates:
  # Path to custom jinja chat template for Llama3 (used when model_type=Llama3)
  llama3_chat_template: tool_chat_template_llama3.1_json.jinja

logging:
  # Raw request/response debug log. Relative paths are resolved from the
  # directory that contains this config file.
  raw_message_log: raw_message-new-server.log

# If true (default), <tool_call_security>...</tool_call_security> blocks are
# removed from historical messages before the prompt is built and sent to the
# model. Set to false to pass history through unmodified.
strip_tool_call_security_in_history: true
